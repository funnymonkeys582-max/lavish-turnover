<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600">
  <defs>
    <filter id="docBlur" x="-5%" y="-5%" width="110%" height="110%">
      <feGaussianBlur stdDeviation="2.4" />
    </filter>
    <linearGradient id="paperBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f8fafc"/>
    </linearGradient>
  </defs>

  <!-- Desk background -->
  <rect width="800" height="600" fill="#1e293b"/>
  
  <!-- Desk wood/texture lines -->
  <g stroke="#334155" stroke-width="1" opacity="0.4">
    <line x1="0" y1="120" x2="800" y2="120"/>
    <line x1="0" y1="280" x2="800" y2="280"/>
    <line x1="0" y1="440" x2="800" y2="440"/>
  </g>

  <!-- Document Paper with soft motion/focus blur -->
  <g filter="url(#docBlur)">
    <!-- Shadow -->
    <rect x="180" y="50" width="440" height="500" rx="8" fill="#000000" opacity="0.3"/>
    
    <!-- Paper Sheet -->
    <rect x="170" y="40" width="440" height="500" rx="6" fill="url(#paperBg)"/>

    <!-- Document Header -->
    <rect x="210" y="80" width="40" height="40" rx="6" fill="#0284c7"/>
    <text x="260" y="98" font-family="'Geist', 'Arial', sans-serif" font-weight="700" font-size="16" fill="#0f172a">OFFICIAL TAX INVOICE</text>
    <text x="260" y="114" font-family="'Geist Mono', monospace" font-size="11" fill="#64748b">INV-2026-08942 • VERIFIED</text>
    <line x1="210" y1="135" x2="570" y2="135" stroke="#cbd5e1" stroke-width="1.5"/>

    <!-- Customer Info -->
    <text x="210" y="165" font-family="'Geist', sans-serif" font-size="11" font-weight="600" fill="#334155">BILLED TO:</text>
    <text x="210" y="180" font-family="'Geist', sans-serif" font-size="13" font-weight="700" fill="#0f172a">Acme Global Corporation Ltd.</text>
    <text x="210" y="195" font-family="'Geist', sans-serif" font-size="11" fill="#475569">440 Tech Plaza, Suite 900</text>
    <text x="210" y="210" font-family="'Geist', sans-serif" font-size="11" fill="#475569">San Francisco, CA 94107</text>

    <!-- Dates -->
    <text x="440" y="165" font-family="'Geist', sans-serif" font-size="11" font-weight="600" fill="#334155">ISSUE DATE:</text>
    <text x="440" y="180" font-family="'Geist Mono', monospace" font-size="12" fill="#0f172a">OCT 27, 2026</text>
    <text x="440" y="200" font-family="'Geist', sans-serif" font-size="11" font-weight="600" fill="#334155">DUE DATE:</text>
    <text x="440" y="215" font-family="'Geist Mono', monospace" font-size="12" fill="#0f172a">NOV 10, 2026</text>

    <!-- Table Header -->
    <rect x="210" y="235" width="360" height="26" fill="#f1f5f9" rx="3"/>
    <text x="220" y="252" font-family="'Geist', sans-serif" font-size="10" font-weight="700" fill="#475569">ITEM DESCRIPTION</text>
    <text x="420" y="252" font-family="'Geist', sans-serif" font-size="10" font-weight="700" fill="#475569">QTY</text>
    <text x="470" y="252" font-family="'Geist', sans-serif" font-size="10" font-weight="700" fill="#475569">RATE</text>
    <text x="530" y="252" font-family="'Geist', sans-serif" font-size="10" font-weight="700" fill="#475569">TOTAL</text>

    <!-- Row 1 -->
    <text x="220" y="280" font-family="'Geist', sans-serif" font-size="11" fill="#0f172a">High-Density Optical Sensor Array</text>
    <text x="425" y="280" font-family="'Geist Mono', monospace" font-size="11" fill="#334155">2</text>
    <text x="470" y="280" font-family="'Geist Mono', monospace" font-size="11" fill="#334155">$450.00</text>
    <text x="530" y="280" font-family="'Geist Mono', monospace" font-size="11" font-weight="600" fill="#0f172a">$900.00</text>
    <line x1="210" y1="295" x2="570" y2="295" stroke="#e2e8f0" stroke-width="1"/>

    <!-- Row 2 -->
    <text x="220" y="318" font-family="'Geist', sans-serif" font-size="11" fill="#0f172a">Precision Lens Calibration Calibration</text>
    <text x="425" y="318" font-family="'Geist Mono', monospace" font-size="11" fill="#334155">1</text>
    <text x="470" y="318" font-family="'Geist Mono', monospace" font-size="11" fill="#334155">$320.00</text>
    <text x="530" y="318" font-family="'Geist Mono', monospace" font-size="11" font-weight="600" fill="#0f172a">$320.00</text>
    <line x1="210" y1="333" x2="570" y2="333" stroke="#e2e8f0" stroke-width="1"/>

    <!-- Row 3 -->
    <text x="220" y="356" font-family="'Geist', sans-serif" font-size="11" fill="#0f172a">Neural Processing Module (NPU-V4)</text>
    <text x="425" y="356" font-family="'Geist Mono', monospace" font-size="11" fill="#334155">4</text>
    <text x="470" y="356" font-family="'Geist Mono', monospace" font-size="11" fill="#334155">$175.00</text>
    <text x="530" y="356" font-family="'Geist Mono', monospace" font-size="11" font-weight="600" fill="#0f172a">$700.00</text>
    <line x1="210" y1="371" x2="570" y2="371" stroke="#e2e8f0" stroke-width="1"/>

    <!-- Summary Box -->
    <rect x="400" y="390" width="170" height="60" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1" rx="4"/>
    <text x="410" y="408" font-family="'Geist', sans-serif" font-size="10" fill="#64748b">SUBTOTAL:</text>
    <text x="510" y="408" font-family="'Geist Mono', monospace" font-size="10" fill="#334155">$1,920.00</text>
    <text x="410" y="424" font-family="'Geist', sans-serif" font-size="10" fill="#64748b">TAX (8.5%):</text>
    <text x="510" y="424" font-family="'Geist Mono', monospace" font-size="10" fill="#334155">$163.20</text>
    <text x="410" y="442" font-family="'Geist', sans-serif" font-size="12" font-weight="700" fill="#0f172a">TOTAL DUE:</text>
    <text x="500" y="442" font-family="'Geist Mono', monospace" font-size="12" font-weight="700" fill="#0284c7">$2,083.20</text>

    <!-- Barcode at bottom -->
    <g fill="#1e293b">
      <rect x="210" y="470" width="3" height="35"/>
      <rect x="216" y="470" width="6" height="35"/>
      <rect x="226" y="470" width="2" height="35"/>
      <rect x="232" y="470" width="8" height="35"/>
      <rect x="244" y="470" width="4" height="35"/>
      <rect x="252" y="470" width="2" height="35"/>
      <rect x="258" y="470" width="7" height="35"/>
      <rect x="270" y="470" width="3" height="35"/>
      <rect x="276" y="470" width="5" height="35"/>
      <rect x="286" y="470" width="2" height="35"/>
      <rect x="292" y="470" width="8" height="35"/>
      <rect x="304" y="470" width="4" height="35"/>
      <rect x="312" y="470" width="6" height="35"/>
      <rect x="322" y="470" width="3" height="35"/>
      <rect x="328" y="470" width="2" height="35"/>
      <rect x="334" y="470" width="7" height="35"/>
      <rect x="345" y="470" width="4" height="35"/>
      <rect x="353" y="470" width="5" height="35"/>
      <rect x="362" y="470" width="2" height="35"/>
      <rect x="368" y="470" width="8" height="35"/>
    </g>
    <text x="210" y="520" font-family="'Geist Mono', monospace" font-size="10" fill="#64748b">* 8 9 4 2 0 1 7 5 3 2 *</text>
  </g>
</svg>
